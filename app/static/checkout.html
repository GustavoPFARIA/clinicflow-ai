<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · ClinicFlow</title>
<style>
:root{--bg:#f6f9fc;--card:#fff;--ink:#1a1f36;--muted:#697386;--line:#e3e8ee;--brand:#635bff;--brand-ink:#fff;
  --test:#ffde92;--test-ink:#8a5a00;--ok:#0e9f6e;--ok-soft:#def7ec;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#161b24;--ink:#e6edf3;--muted:#8b98a5;--line:#2a3340;
  --brand:#7a73ff;--test:#4a3a12;--test-ink:#ffcf66;--ok:#34d399;--ok-soft:#0f2e24;--field:#0e1117}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;padding:24px 16px}
.wrap{width:100%;max-width:420px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-weight:700;display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px}
.test{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:5px;background:var(--test);color:var(--test-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.item{display:flex;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.item b{display:block}.item small{color:var(--muted)}
.amount{font-size:28px;font-weight:700;margin:16px 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);
  font:inherit;letter-spacing:.04em;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:600 16px system-ui;cursor:pointer;margin-top:4px}
button:hover{filter:brightness(1.08)}
.paid{text-align:center;padding:8px 0}
.check{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:28px;margin:0 auto 12px}
.paid h2{margin:0 0 4px;font-size:20px}.paid p{color:var(--muted);margin:0 0 16px}
.back{display:block;text-align:center;color:var(--brand);text-decoration:none;font-weight:600;margin-top:4px}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
code{font-size:11px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <span class="brand"><span class="logo">C</span>ClinicFlow Clinic</span>
    <span class="test" title="No real money is charged">TEST MODE</span>
  </div>
  <section class="card">
    <div class="item">
      <div><b>{specialty} consultation</b><small>{doctor} · {when}</small></div>
      <small>#{appointment_id}</small>
    </div>
    {body}
  </section>
  <p class="note">Local stand-in for Stripe Checkout. Paying sends a <b>signed</b> <code>checkout.session.completed</code>
    webhook through the same verification and idempotency path as production.</p>
</main>
</body>
</html>
