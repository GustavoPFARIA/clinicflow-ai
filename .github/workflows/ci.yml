name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, tests (SQLite) and agent evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit & integration tests
        run: pytest -q
      - name: Agent evals with real embeddings (fail below 95%)
        env:
          EMBEDDING_PROVIDER: fastembed
        run: python -m evals.run_evals --min-pass-rate 0.95
      - name: Publish eval report
        if: always()
        run: cat evals/results.md >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: Tests on Postgres + pgvector
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clinicflow
          POSTGRES_PASSWORD: clinicflow
          POSTGRES_DB: clinicflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinicflow" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clinicflow:clinicflow@localhost:5432/clinicflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t clinicflow-ai .
